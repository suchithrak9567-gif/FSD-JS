<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f3f4f6;
            font-family:Arial, Helvetica, sans-serif;
        }

        .register-card{
            max-width:600px;
            margin:60px auto;
            padding:35px;
            background:#fff;
            border-radius:18px;
            box-shadow:0 10px 25px rgba(0,0,0,.12);
        }

        .register-card h2{
            color:#0d6efd;
            font-weight:bold;
            text-align:center;
            margin-bottom:30px;
        }

        .btn-register{
            background:#0d6efd;
            color:#fff;
            font-size:18px;
            padding:10px;
        }

        .btn-register:hover{
            background:#0b5ed7;
            color:#fff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="register-card">

        <h2>🚀 Create Account</h2>

        <form id="signup-form" novalidate>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" >
                <div id="name-error" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control">
                                <div id="email-error" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password"  id="password" class="form-control">
                                <div id="password-error" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirm-password" class="form-control" required >
                                <div id="confirm-password-error" class="text-danger small mt-1"></div>
            </div>

            <div class="d-grid">
                <button type="submit" id="register-btn" class="btn btn-register">
                    Create Account
                </button>
                                <div id="success-message" class="text-success small mt-1"></div>
            </div>

        </form>

    </div>
</div>
<script src="javascript.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
